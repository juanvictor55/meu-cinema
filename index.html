<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meus filmes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e8f0fc;
    --panel: #ffffff;
    --ink: #0c1f3f;
    --muted: #56698d;
    --line: #cbd9f1;
    --navy: #0a2150;
    --accent: #1d5fe0;
    --accent-soft: #dce8ff;
    --star: #f2a60c;
    --star-off: #cbd9f1;
    --head: "Bricolage Grotesque", system-ui, sans-serif;
    --body: "Instrument Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    line-height: 1.45;
  }
  .top { position: relative; background: var(--navy); color: #fff; padding: 2.5rem 1.25rem 4.5rem; }
  .top-in { max-width: 1100px; margin: 0 auto; }
  .top::after { /* furinhos de rolo de filme */
    content: ""; position: absolute; left: 0; right: 0; bottom: 1.6rem; height: 10px;
    background: radial-gradient(circle at 50% 50%, rgba(255,255,255,.22) 0 3px, transparent 3.5px) 0 0 / 22px 10px repeat-x;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 1.25rem 4rem; }
  h1 {
    font-family: var(--head);
    font-weight: 800;
    font-size: clamp(2.2rem, 6vw, 3.6rem);
    letter-spacing: -0.03em;
    line-height: 1;
    margin: 0 0 .5rem;
  }
  .top p { margin: 0; color: #a9c1ee; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* ---------- filtros ---------- */
  .filters {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 1.25rem;
    position: relative; margin-top: -1.8rem;
    box-shadow: 0 8px 24px rgba(10, 33, 80, .12);
    display: grid;
    gap: 1rem 1.25rem;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  }
  .field { display: flex; flex-direction: column; gap: .35rem; min-width: 0; }
  .field > label, .field > .lbl { font-size: .85rem; font-weight: 600; color: var(--muted); }
  input[type="search"], input[type="number"], select, summary {
    font: inherit;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: .55rem .7rem;
    width: 100%;
  }
  summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: .5rem; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "▾"; color: var(--muted); }
  details { position: relative; }
  details[open] summary { border-color: var(--accent); }
  .menu {
    position: absolute; z-index: 10; top: calc(100% + 4px); left: 0;
    width: max(100%, 230px); max-height: 280px; overflow-y: auto;
    background: #fff; border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 10px 30px rgba(10, 33, 80, .2);
    padding: .4rem;
  }
  .menu label {
    display: flex; align-items: center; gap: .55rem;
    padding: .35rem .5rem; border-radius: 6px; cursor: pointer; font-size: .95rem;
  }
  .menu label:hover { background: var(--accent-soft); }
  .menu label input { accent-color: var(--accent); width: 1rem; height: 1rem; }
  .menu label[hidden] { display: none; }
  .menu #gen-busca {
    position: sticky; top: 0; margin-bottom: .35rem; padding: .45rem .6rem;
    box-shadow: 0 0 0 4px #fff;
  }
  .menu .sem { margin: .5rem; color: var(--muted); font-size: .9rem; }

  .chips { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  .chips .lbl { font-size: .85rem; font-weight: 600; color: var(--muted); margin-right: .25rem; }
  .chip { position: relative; }
  .chip input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
  .chip span {
    display: inline-block; padding: .4rem .9rem; border-radius: 999px;
    border: 1px solid var(--line); background: #fff; font-weight: 500; font-size: .95rem;
  }
  .chip input:checked + span { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
  #limpar {
    margin-left: auto; font: inherit; font-weight: 600; color: var(--accent);
    background: none; border: 0; cursor: pointer; padding: .4rem .6rem;
  }
  #limpar:hover { text-decoration: underline; }

  /* ---------- resultado ---------- */
  .count {
    font-family: var(--head); font-weight: 700; font-size: 1.4rem;
    margin: 2rem 0 .75rem;
  }
  .list { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 13rem 4rem 9rem;
    gap: .75rem;
    align-items: center;
    padding: .7rem 1.1rem;
    border-top: 1px solid var(--line);
  }
  .row.head { border-top: 0; background: #f0f5ff; padding-block: .5rem; }
  .row.head button {
    font: inherit; font-size: .85rem; font-weight: 600; color: var(--muted);
    background: none; border: 0; padding: 0; cursor: pointer; text-align: left;
  }
  .row.head button:hover { color: var(--ink); }
  .row.head button[aria-sort]::after { content: " ↑"; }
  .row.head button[aria-sort="descending"]::after { content: " ↓"; }
  .titulo { font-weight: 600; }
  .row:not(.head):hover { background: #f5f9ff; }
  .franq { font-weight: 400; color: var(--muted); margin-right: .55rem; padding-right: .55rem; border-right: 1px solid var(--line); }
  .gen, .ano { color: var(--muted); font-size: .95rem; }
  .nota { display: flex; align-items: center; gap: .5rem; font-weight: 600; }
  .stars {
    position: relative; display: inline-block; font-size: .95rem; letter-spacing: 1px;
    color: var(--star-off); line-height: 1;
  }
  .stars::before { content: "★★★★★"; }
  .stars i {
    position: absolute; inset: 0 auto 0 0; overflow: hidden; color: var(--star);
  }
  .stars i::before { content: "★★★★★"; }
  .aviso {
    margin: 1.5rem 0 0; padding: .7rem 1rem; border-radius: 10px;
    background: #fff6dc; border: 1px solid #f0d58a; color: #5c4506; font-size: .95rem;
  }
  .vazio { padding: 2.5rem 1.1rem; text-align: center; color: var(--muted); }

  @media (max-width: 640px) {
    .row { grid-template-columns: 1fr auto; row-gap: .15rem; }
    .row.head { display: none; }
    .titulo { grid-column: 1 / -1; }
    .gen { grid-column: 1; }
    .ano { grid-column: 2; grid-row: 2; }
    .nota { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <h1>Meus filmes</h1>
    <p>Tudo que eu já assisti, com as minhas notas.</p>
  </div>
</header>

<div class="wrap">

  <section class="filters" aria-label="Filtros">
    <div class="field">
      <label for="f-nome">Nome</label>
      <input type="search" id="f-nome" placeholder="Ex.: harry potter">
    </div>
    <div class="field">
      <label for="f-ano">Ano</label>
      <input type="number" id="f-ano" placeholder="Ex.: 2025" min="1900" max="2100">
    </div>
    <div class="field">
      <label for="f-decada">Década</label>
      <select id="f-decada"></select>
    </div>
    <div class="field">
      <label for="f-franquia">Franquia</label>
      <input type="search" id="f-franquia" placeholder="Ex.: pânico">
    </div>
    <div class="field">
      <span class="lbl" id="lbl-gen">Gênero</span>
      <details id="dd-gen">
        <summary aria-labelledby="lbl-gen"><span id="gen-resumo">Todos</span></summary>
        <div class="menu">
          <input type="search" id="gen-busca" placeholder="Digite para filtrar…" autocomplete="off" aria-label="Buscar gênero">
          <div id="gen-menu"></div>
          <p class="sem" id="gen-sem" hidden>Nenhum gênero encontrado</p>
        </div>
      </details>
    </div>
    <div class="field">
      <label for="f-igual">Nota igual a</label>
      <select id="f-igual"></select>
    </div>
    <div class="field">
      <label for="f-maior">Nota maior que</label>
      <select id="f-maior"></select>
    </div>
    <div class="field">
      <label for="f-menor">Nota menor que</label>
      <select id="f-menor"></select>
    </div>

    <div class="chips" role="group" aria-label="Categorias">
      <span class="lbl">Categorias</span>
      <label class="chip"><input type="checkbox" id="c-animacao"><span>Animação</span></label>
      <label class="chip"><input type="checkbox" id="c-live"><span>Live Action</span></label>
      <label class="chip"><input type="checkbox" id="c-br"><span>Brasileiro</span></label>
      <button type="button" id="limpar">Limpar filtros</button>
    </div>
  </section>

  <p class="aviso" id="aviso" hidden></p>

  <h2 class="count" id="contagem" aria-live="polite"></h2>

  <section class="list" id="lista"></section>
</div>

<script>
/* ============================================================
   CONFIGURAÇÃO — COLE AQUI O LINK DO CSV DA SUA PLANILHA
   (Google Planilhas > Arquivo > Compartilhar > Publicar na Web
    > escolha a aba > formato CSV > Publicar > copie o link)
   ============================================================ */
const URL_PLANILHA = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQMYIHHlVTrxcH_v_80tqEjUqPqI9GuqmWSHYvN7wkCR8Nh7mkjrpvrQWfGXUPL5v6eDjqaSgYN8b1r/pub?gid=0&single=true&output=csv";

/* ------------------------------------------------------------

   nome | genero | genero 2 | ano | nota | categorias | franquia
   Categorias: A = Animação, L = Live Action, B = Brasileiro
   ------------------------------------------------------------ */
const DADOS = `

/* Transforma o texto acima em uma lista de objetos */
let filmes = [];
const filmesExemplo = DADOS.trim().split("\n").map(linha => {
  const [nome, g1, g2, ano, nota, cats, franquia] = linha.split("|");
  return {
    nome,
    generos: [g1, g2].filter(Boolean),
    ano: Number(ano),
    nota: parseFloat(nota.replace(",", ".")),
    animacao: cats.includes("A"),
    live: cats.includes("L"),
    br: cats.includes("B"),
    franquia: franquia || ""
  };
});

/* ---------------- helpers ---------------- */
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const normaliza = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const fmtNota = n => n.toFixed(1).replace(".", ",");

/* ---------------- montar os menus ---------------- */

/* décadas que existem na lista (1990, 2000, 2010...) */
const decadaDe = ano => Math.floor(ano / 10) * 10;
const nomeDecada = d => "Anos " + (d < 2000 ? String(d).slice(2) : d);

/* gêneros e décadas dependem dos filmes, então são montados depois que os dados chegam */
function montarMenus() {
  const todosGeneros = [...new Set(filmes.flatMap(f => f.generos))].sort((a, b) => a.localeCompare(b, "pt-BR"));
  $("gen-menu").innerHTML = todosGeneros
    .map(g => `<label><input type="checkbox" value="${esc(g)}"> ${esc(g)}</label>`).join("");

  const decadas = [...new Set(filmes.map(f => decadaDe(f.ano)))].sort((a, b) => b - a);
  $("f-decada").innerHTML = '<option value="">Todas</option>' +
    decadas.map(d => `<option value="${d}">${nomeDecada(d)}</option>`).join("");
}

const opcoesNota = ['<option value="">Qualquer</option>'];
for (let n = 0; n <= 5; n += 0.5) opcoesNota.push(`<option value="${n}">${fmtNota(n)}</option>`);
["f-igual", "f-maior", "f-menor"].forEach(id => $(id).innerHTML = opcoesNota.join(""));

/* ---------------- estado de ordenação ---------------- */
let ordem = { chave: null, dir: "asc" };

/* ---------------- filtrar + mostrar ---------------- */
function aplicar() {
  const nome = normaliza($("f-nome").value.trim());
  const ano = $("f-ano").value;
  const decada = $("f-decada").value;
  const franq = normaliza($("f-franquia").value.trim());
  const igual = $("f-igual").value, maior = $("f-maior").value, menor = $("f-menor").value;
  const generos = [...document.querySelectorAll("#gen-menu input:checked")].map(i => i.value);

  let lista = filmes.filter(f => {
    if (nome && !normaliza(f.nome).includes(nome)) return false;
    if (ano && f.ano !== Number(ano)) return false;
    if (decada && decadaDe(f.ano) !== Number(decada)) return false;
    if (generos.length && !generos.some(g => f.generos.includes(g))) return false;
    if (igual !== "" && f.nota !== Number(igual)) return false;
    if (maior !== "" && !(f.nota > Number(maior))) return false;
    if (menor !== "" && !(f.nota < Number(menor))) return false;
    if ($("c-animacao").checked && !f.animacao) return false;
    if ($("c-live").checked && !f.live) return false;
    if ($("c-br").checked && !f.br) return false;
    if (franq && !normaliza(f.franquia).includes(franq)) return false;
    return true;
  });

  if (ordem.chave) {
    const k = ordem.chave, m = ordem.dir === "asc" ? 1 : -1;
    lista = [...lista].sort((a, b) =>
      (k === "nome" || k === "generos"
        ? String(k === "generos" ? a.generos[0] : a.nome).localeCompare(String(k === "generos" ? b.generos[0] : b.nome), "pt-BR")
        : a[k] - b[k]) * m);
  }

  $("gen-resumo").textContent = generos.length === 0 ? "Todos" : generos.length <= 2 ? generos.join(", ") : generos.length + " selecionados";

  $("contagem").textContent =
    lista.length === 0 ? "Nenhum filme encontrado"
    : lista.length === 1 ? "1 filme encontrado"
    : `${lista.length} filmes encontrados`;

  const th = (k, texto) =>
    `<button type="button" data-ordem="${k}"${ordem.chave === k ? ` aria-sort="${ordem.dir === "asc" ? "ascending" : "descending"}"` : ""}>${texto}</button>`;

  let html = `<div class="row head">${th("nome", "Filme")}${th("generos", "Gênero")}${th("ano", "Ano")}${th("nota", "Nota")}</div>`;
  if (lista.length === 0) {
    html += `<div class="vazio">Nenhum filme bate com esses filtros. Tente afrouxar algum deles ou clique em “Limpar filtros”.</div>`;
  } else {
    html += lista.map(f => `
      <div class="row">
        <div class="titulo">${f.franquia ? `<span class="franq">${esc(f.franquia)}</span>` : ""}${esc(f.nome)}</div>
        <div class="gen">${esc(f.generos.join(" / "))}</div>
        <div class="ano">${f.ano}</div>
        <div class="nota"><span class="stars" aria-hidden="true"><i style="width:${f.nota / 5 * 100}%"></i></span>${fmtNota(f.nota)}</div>
      </div>`).join("");
  }
  $("lista").innerHTML = html;
}

/* ---------------- eventos ---------------- */
document.querySelector(".filters").addEventListener("input", aplicar);

$("lista").addEventListener("click", e => {
  const b = e.target.closest("[data-ordem]");
  if (!b) return;
  const k = b.dataset.ordem;
  if (ordem.chave === k) {
    if (ordem.dir === "asc") ordem.dir = "desc";
    else ordem = { chave: null, dir: "asc" };   // 3º clique volta à ordem da planilha
  } else {
    ordem = { chave: k, dir: k === "nota" ? "desc" : "asc" };
  }
  aplicar();
});

$("limpar").addEventListener("click", () => {
  document.querySelectorAll(".filters input").forEach(i => i.type === "checkbox" ? i.checked = false : i.value = "");
  document.querySelectorAll(".filters select").forEach(s => s.value = "");
  filtraGeneros();
  aplicar();
});

/* busca dentro do menu de gêneros */
function filtraGeneros() {
  const q = normaliza($("gen-busca").value.trim());
  let visiveis = 0;
  $("gen-menu").querySelectorAll("label").forEach(l => {
    const mostra = normaliza(l.textContent).includes(q);
    l.hidden = !mostra;
    if (mostra) visiveis++;
  });
  $("gen-sem").hidden = visiveis > 0;
}
$("gen-busca").addEventListener("input", filtraGeneros);
$("gen-busca").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  e.preventDefault();
  const primeiro = $("gen-menu").querySelector("label:not([hidden]) input");
  if (!primeiro) return;
  primeiro.checked = !primeiro.checked;   // Enter marca/desmarca o primeiro da lista
  $("gen-busca").value = "";              // limpa para você digitar o próximo
  filtraGeneros();
  aplicar();
});
$("dd-gen").addEventListener("toggle", () => { if ($("dd-gen").open) $("gen-busca").focus(); });

/* fecha o menu de gêneros ao clicar fora ou apertar Esc */
document.addEventListener("click", e => { if (!$("dd-gen").contains(e.target)) $("dd-gen").open = false; });
document.addEventListener("keydown", e => { if (e.key === "Escape") $("dd-gen").open = false; });

/* ---------------- ler a planilha (CSV) ---------------- */
function parseCSV(texto) {
  const linhas = [];
  let linha = [], campo = "", entreAspas = false;
  for (let i = 0; i < texto.length; i++) {
    const c = texto[i];
    if (entreAspas) {
      if (c === '"' && texto[i + 1] === '"') { campo += '"'; i++; }
      else if (c === '"') entreAspas = false;
      else campo += c;
    } else if (c === '"') entreAspas = true;
    else if (c === ",") { linha.push(campo); campo = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && texto[i + 1] === "\n") i++;
      linha.push(campo); linhas.push(linha); linha = []; campo = "";
    } else campo += c;
  }
  if (campo !== "" || linha.length) { linha.push(campo); linhas.push(linha); }
  return linhas;
}

/* usa os NOMES das colunas da primeira linha, então a ordem das colunas não importa */
function csvParaFilmes(texto) {
  const [cab, ...linhas] = parseCSV(texto);
  const col = nome => cab.findIndex(h => normaliza(h.trim()) === nome);
  const i = {
    nome: col("filme"), g1: col("genero"), g2: col("genero 2"), ano: col("ano"), nota: col("nota"),
    animacao: col("animacao"), live: col("live action"), br: col("brasileiro"), franquia: col("franquia")
  };
  if (i.nome < 0 || i.ano < 0 || i.nota < 0) throw new Error("Colunas Filme/Ano/Nota não encontradas");
  const v = (l, k) => (k >= 0 && l[k] ? l[k].trim() : "");
  const marcado = x => x !== "" && normaliza(x) !== "false";

  return linhas.map(l => ({
    nome: v(l, i.nome),
    generos: [v(l, i.g1), v(l, i.g2)].filter(Boolean),
    ano: parseInt(v(l, i.ano).replace(/\D/g, ""), 10),
    nota: parseFloat(v(l, i.nota).replace(",", ".")),
    animacao: marcado(v(l, i.animacao)),
    live: marcado(v(l, i.live)),
    br: marcado(v(l, i.br)),
    franquia: v(l, i.franquia)
  })).filter(f => f.nome && !isNaN(f.ano) && !isNaN(f.nota));
}

function avisar(msg) { $("aviso").textContent = msg; $("aviso").hidden = false; }

async function carregar() {
  const semLink = URL_PLANILHA.startsWith("COLE_AQUI");
  try {
    if (semLink) throw new Error("sem link");
    $("lista").innerHTML = '<div class="vazio">Carregando sua planilha…</div>';
    const resp = await fetch(URL_PLANILHA, { cache: "no-store" });
    if (!resp.ok) throw new Error("Erro HTTP " + resp.status);
    filmes = csvParaFilmes(await resp.text());
    if (filmes.length === 0) throw new Error("Nenhum filme encontrado no CSV");
  } catch (erro) {
    filmes = filmesExemplo;
    avisar(semLink
      ? "Mostrando filmes de exemplo. Cole o link do CSV da sua planilha em URL_PLANILHA, no começo do JavaScript."
      : "Não consegui carregar sua planilha (" + erro.message + "). Mostrando os filmes de exemplo. Se você abriu o arquivo direto do computador, tente abrir pelo Live Server do VS Code.");
    console.error(erro);
  }
  montarMenus();
  aplicar();
}

carregar();
